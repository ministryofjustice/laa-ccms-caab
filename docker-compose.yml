services:
  laa-ccms-caab-oidc-mock:
    container_name: laa-ccms-caab-oidc-mock
    build:
      context: ../laa-oidc-mock-server
    ports:
      - "9000:9000"
    environment:
      # The mock registers a single redirect URI, http://<REDIRECT_BASE_URI>/login/oauth2/code/silas-identity,
      # so this has to carry the application's context path as well as its host and port. The
      # "silas-identity" segment is the spring client registration id and is fixed by the mock.
      REDIRECT_BASE_URI: localhost:8010/civil

  laa-ccms-mock-contracts:
    container_name: laa-ccms-caab-mock-contracts
    build:
      context: ../laa-ccms-mock-contracts
    ports:
      - "7777:7777"

  laa-ccms-caab-wiremock:
    container_name: laa-ccms-caab-wiremock
    image: wiremock/wiremock:3.13.2
    command: --global-response-templating
    ports:
      - "8020:8080"
    volumes:
      - ./wiremock:/home/wiremock

  laa-ccms-caab-clam-av:
    container_name: laa-ccms-caab-clam-av
    image: clamav/clamav-debian:1.5.2
    restart: unless-stopped
    volumes:
      - clam:/var/lib/clamav
    ports:
      - "3310:3310"

  laa-ccms-caab-localstack:
    container_name: laa-ccms-caab-localstack
    image: localstack/localstack:community-archive
    ports:
      - "127.0.0.1:4566:4566"                   # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"         # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=1                                 # Logging
      - USE_SSL=1                               # Return URLs using HTTPS
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh"

  laa-ccms-soa-proxy:
    container_name: laa-ccms-soa-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8051:8051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./soa-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro

  laa-ccms-caab-prometheus:
    container_name: laa-ccms-caab-prometheus
    image: prom/prometheus:v3
    restart: unless-stopped
    networks:
      - local-prom
    ports:
      - "9090:9090"
    volumes:
      - ./localmetrics/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  clam:
  wiremock:
  prometheus:
  grafana-storage:

networks:
  local-prom:
    driver: bridge
