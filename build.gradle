plugins {
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '4.1.1'
    id 'com.diffplug.spotless' version '8.11.0'
}

configurations {
    mockitoAgent {
        transitive = false
    }
}

subprojects {
    group = 'uk.gov.laa.ccms.caab'
}

repositories {

    mavenCentral()

    // Define the common configuration block for GitHub repositories
    def githubRepoConfig = { repoUrl ->
        maven {
            url = repoUrl
            credentials {
                username = System.getenv("GITHUB_ACTOR")?.trim() ?: project.findProperty('project.ext.gitPackageUser')
                password = System.getenv("GITHUB_TOKEN")?.trim() ?: project.findProperty('project.ext.gitPackageKey')
            }
        }
    }

    // Configure repositories using the defined GitHub config
    def dataApiRepository = githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-data-api')
    exclusiveContent {
        forRepositories(dataApiRepository)
        filter {
            includeModule('uk.gov.laa.ccms.data', 'data-api')
        }
    }
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-caab-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-soa-gateway-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-caab-assessment-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-spring-boot-common')
}

configurations.configureEach {
    // The application does not use native QUIC. Keep the Java QUIC API available because
    // Reactor Netty references it when initialising HTTPS clients.
    exclude group: 'io.netty', module: 'netty-codec-native-quic'

    resolutionStrategy.eachDependency { details ->
        // Build-time only: reaches us via checkstyle's doxia transitives, never the app classpath.
        if (details.requested.group == 'org.codehaus.plexus'
                && details.requested.name == 'plexus-utils') {
            details.useVersion '3.6.1'
            details.because 'Snyk override (SNYK-JAVA-ORGCODEHAUSPLEXUS-15766699); checkstyle pins the vulnerable 3.3.0'
        }
        // Logback classic pulled in by Spring Boot starter logging
        if (details.requested.group == 'ch.qos.logback'
                && details.requested.name in ['logback-classic', 'logback-core']) {
            details.useVersion '1.6.5'
            details.because 'Snyk override (SNYK-JAVA-CHQOSLOGBACK-20824362); directory traversal vulnerability in 1.6.3'
        }
        // Reaches us via the OIDC stack: oauth2-oidc-sdk -> json-smart -> accessors-smart.
        if (details.requested.group == 'org.ow2.asm'
                && details.requested.name == 'asm') {
            details.useVersion '9.11.1'
            details.because 'Snyk override (SNYK-JAVA-ORGOW2ASM-21715439 and five related); 9.11 still carries an infinite-loop issue'
        }
    }
}

// The Dockerfile copies the boot jar from build/libs, so do not build a plain jar alongside it.
tasks.named('jar') {
    enabled = false
}

// Replaces application.yml @version@ with the project version
processResources {
    inputs.property('applicationVersion', project.version.toString())
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version.toString())
        }
    }
}

dependencies {

    // Renders the POA summary: an HTML template is built with Thymeleaf (already present) and
    // converted to PDF, the same pairing the legacy PUI uses for its financial summaries.
    implementation 'org.xhtmlrenderer:flying-saucer-pdf-openpdf:9.4.0'

    implementation 'uk.gov.laa.ccms.data:data-api:0.5.1'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.13'

    // 0.1.3 carries GetInvoiceData, needed to copy a rejected bill.
    implementation 'uk.gov.laa.ccms.soa.gateway:soa-gateway-api:0.1.3'

    implementation 'uk.gov.laa.ccms.caab:caab-api:0.26.0'

    implementation 'uk.gov.laa.ccms.caab:assessment-api:0.0.57'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation 'org.apache.tika:tika-core:4.2.0'

    // These were previously pulled in transitively via the SAML/opensaml stack; declared
    // explicitly now that SAML has been replaced by OIDC (see EvidenceService, CspReportController,
    // ConnectorApiClient and the various mapper context classes).
    implementation 'com.google.guava:guava:33.8.0-jre'
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'

    // Starters
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.data:spring-data-commons'

	// AWS S3 Integration
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.2.2')
	implementation 'io.awspring.cloud:spring-cloud-aws-starter'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	implementation 'software.amazon.awssdk:sts'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'org.json:json:20260814'

    implementation 'io.swagger.core.v3:swagger-annotations:3.0.0'

    //OIDC security (EntraID)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-govuk-dialect'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.micrometer:context-propagation'

    // Metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.prometheus:prometheus-metrics-tracer-initializer'

    //ClamAV virus scan
    implementation 'fi.solita.clamav:clamav-client:1.0.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'io.projectreactor:reactor-test:3.9.0'

    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'

    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-localstack'

    mockitoAgent "org.mockito:mockito-core"
}

test {
    useJUnitPlatform()

    jvmArgs(
            "-javaagent:${configurations.mockitoAgent.asPath}",
            "-Xshare:off",
            "-Dnet.bytebuddy.safe=true" // Prevent unsafe memory access, see https://github.com/raphw/byte-buddy/issues/1803
    )

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/CaabApplication.class', '**/SecurityConfiguration.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/CaabApplication.class', '**/SecurityConfiguration.class'])
        }))
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat('1.34.1')
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = false
}

/**
 * Automatically installs the git pre-commit hook to run secret checks and spotlessApply.
 */
tasks.register('installGitHooks', Copy) {
    onlyIf { rootProject.file('.git').isDirectory() }
    from "scripts/pre-commit"
    into "${rootProject.rootDir}/.git/hooks"

    // Gradle 9.x replacement for fileMode
    filePermissions {
        unix(0755)
    }
}

// Linked to compileJava so it installs on the first build
compileJava.dependsOn installGitHooks

tasks.register('npmInstallCi', Exec) {
    commandLine 'npm', 'ci'
    inputs.file('package-lock.json')
    outputs.dir('node_modules')
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstallCi'
    commandLine 'npm', 'run', 'build:frontend'

    inputs.files(
            'package.json',
            'package-lock.json',
            'gulpfile.js'
    )
    inputs.dir('src/main/resources/scss')
    inputs.dir('node_modules/govuk-frontend')
    inputs.dir('node_modules/@ministryofjustice/frontend')

    outputs.dir('src/main/resources/static/assets')
    outputs.dir('src/main/resources/static/ccms')
}
