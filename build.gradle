plugins {
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.0.3'
    id 'com.diffplug.spotless' version '8.10.0'
}

configurations {
    mockitoAgent {
        transitive = false
    }
}

subprojects {
    group = 'uk.gov.laa.ccms.caab'
}

repositories {

    mavenCentral()

    // Latest version of saml requires this
    maven { url = 'https://build.shibboleth.net/nexus/content/repositories/releases/' }

    // Define the common configuration block for GitHub repositories
    def githubRepoConfig = { repoUrl ->
        maven {
            url = repoUrl
            credentials {
                username = System.getenv("GITHUB_ACTOR")?.trim() ?: project.findProperty('project.ext.gitPackageUser')
                password = System.getenv("GITHUB_TOKEN")?.trim() ?: project.findProperty('project.ext.gitPackageKey')
            }
        }
    }

    // Configure repositories using the defined GitHub config
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-data-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-caab-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-soa-gateway-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-ccms-caab-assessment-api')
    githubRepoConfig('https://maven.pkg.github.com/ministryofjustice/laa-spring-boot-common')
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // Build-time only: reaches us via checkstyle's doxia transitives, never the app classpath.
        if (details.requested.group == 'org.codehaus.plexus'
                && details.requested.name == 'plexus-utils') {
            details.useVersion '3.6.1'
            details.because 'Snyk override (SNYK-JAVA-ORGCODEHAUSPLEXUS-15766699); checkstyle pins the vulnerable 3.3.0'
        }
        // Jackson 2.x and 3.x are both on the classpath; the Spring Boot BOM pins each one patch
        // behind. Bump databind with core to keep the pair in lockstep.
        if (details.requested.group == 'com.fasterxml.jackson.core'
                && details.requested.name in ['jackson-databind', 'jackson-core']) {
            details.useVersion '2.21.6'
            details.because 'Snyk override (SNYK-JAVA-COMFASTERXMLJACKSONCORE-19477042); unsafe reflection in 2.21.5'
        }
        if (details.requested.group == 'tools.jackson.core'
                && details.requested.name in ['jackson-databind', 'jackson-core']) {
            details.useVersion '3.1.6'
            details.because 'Snyk override (SNYK-JAVA-TOOLSJACKSONCORE-19477043); unsafe reflection in 3.1.5'
        }
        // Not managed by the Spring Boot BOM; pulled in transitively via the SAML/opensaml stack.
        if (details.requested.group == 'org.bouncycastle') {
            details.useVersion '1.85'
            details.because 'Override to remediate vulnerability; not covered by the Spring Boot dependency BOM'
        }
    }
}

dependencies {

    // Renders the POA summary: an HTML template is built with Thymeleaf (already present) and
    // converted to PDF, the same pairing the legacy PUI uses for its financial summaries.
    implementation 'org.xhtmlrenderer:flying-saucer-pdf-openpdf:9.4.0'

    implementation 'uk.gov.laa.ccms.data:data-api:0.1.0'

    // 0.1.3 carries GetInvoiceData, needed to copy a rejected bill.
    implementation 'uk.gov.laa.ccms.soa.gateway:soa-gateway-api:0.1.3'

    // 0.7.0 carries the bill id needed to delete a draft (PR #175).
    implementation 'uk.gov.laa.ccms.caab:caab-api:0.8.0'

    implementation 'uk.gov.laa.ccms.caab:assessment-api:0.0.57'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation 'org.apache.tika:tika-core:3.3.2'

    // Starters
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.data:spring-data-commons'

	// AWS S3 Integration
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.0')
	implementation 'io.awspring.cloud:spring-cloud-aws-starter'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	implementation 'software.amazon.awssdk:sts'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'org.json:json:20260814'

    implementation 'io.swagger.core.v3:swagger-annotations:2.2.54'

    //SAML security
    implementation 'org.springframework.boot:spring-boot-starter-security-saml2'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.security:spring-security-saml2-service-provider'

    implementation 'uk.gov.justice.service.laa:laa-spring-boot-starter-govuk-dialect'

    // Metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.prometheus:prometheus-metrics-tracer-initializer'

    //ClamAV virus scan
    implementation 'fi.solita.clamav:clamav-client:1.0.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'io.projectreactor:reactor-test:3.8.7'

    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'

    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-localstack'

    mockitoAgent "org.mockito:mockito-core"
}

test {
    useJUnitPlatform()

    jvmArgs(
            "-javaagent:${configurations.mockitoAgent.asPath}",
            "-Xshare:off",
            "-Dnet.bytebuddy.safe=true" // Prevent unsafe memory access, see https://github.com/raphw/byte-buddy/issues/1803
    )

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/CaabApplication.class', '**/SecurityConfiguration.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/CaabApplication.class', '**/SecurityConfiguration.class'])
        }))
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat('1.34.1')
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = false
}

/**
 * Automatically installs the git pre-commit hook to run spotlessApply.
 */
tasks.register('installGitHooks', Copy) {
    from "scripts/pre-commit"
    into "${rootProject.rootDir}/.git/hooks"

    // Gradle 9.x replacement for fileMode
    filePermissions {
        unix(0755)
    }
}

// Linked to compileJava so it installs on the first build
compileJava.dependsOn installGitHooks

tasks.register('npmInstallCi', Exec) {
    commandLine 'npm', 'ci'
    inputs.file('package-lock.json')
    outputs.dir('node_modules')
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstallCi'
    commandLine 'npm', 'run', 'build:frontend'

    inputs.files(
            'package.json',
            'package-lock.json',
            'gulpfile.js'
    )
    inputs.dir('src/main/resources/scss')
    inputs.dir('node_modules/govuk-frontend')
    inputs.dir('node_modules/@ministryofjustice/frontend')

    outputs.dir('src/main/resources/static/assets')
    outputs.dir('src/main/resources/static/ccms')
}
