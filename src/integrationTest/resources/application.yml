spring:
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
        provider:
          azure:
            issuer-uri: http://localhost:8081/test-tenant/v2.0

  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
      resolve-lazily: true
  cloud:
    aws:
      s3:
        endpoint: http://s3.localhost.localstack.cloud:4566
        region: eu-west-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

server:
  servlet:
    context-path: /civil

laa:
  ccms:
    footer:
      research-panel-link: ""
    pui-home-url: http://localhost:8080/civil/
    features:
      - feature: amendments
        enabled: true
    s3:
      buckets:
        document-bucket:
          name: laa-ccms-documents
          url-duration: 20
    ebs-api:
      hostname: localhost
      port: 8123
      url: http://${laa.ccms.ebs-api.hostname}:${laa.ccms.ebs-api.port}
    soa-api:
      hostname: localhost
      port: 8124
      url: http://${laa.ccms.soa-api.hostname}:${laa.ccms.soa-api.port}
    caab-api:
      hostname: localhost
      port: 8125
      url: http://${laa.ccms.caab-api.hostname}:${laa.ccms.caab-api.port}
    assessment-api:
      hostname: localhost
      port: 8127
      url: http://${laa.ccms.assessment-api.hostname}:${laa.ccms.assessment-api.port}
    connector:
      hostname: localhost
      port: 8129
      url: http://${laa.ccms.connector.hostname}:${laa.ccms.connector.port}
    oracle-web-determination-server:
      hostname: localhost
      port: 7001
      url: http://${laa.ccms.oracle-web-determination-server.hostname}:${laa.ccms.oracle-web-determination-server.port}/opa/web-determinations
      resources:
        interview-styling: ${laa.ccms.oracle-web-determination-server.url}/staticresource/interviews.css
        font-styling: ${laa.ccms.oracle-web-determination-server.url}/staticresource/fonts/fonts.css
        interview-javascript: ${laa.ccms.oracle-web-determination-server.url}/staticresource/interviews.js
        interview-jquery: ${laa.ccms.oracle-web-determination-server.url}/staticresource/jquery-3.6.3.min.js
      redirect:
        hostname: localhost
        port: 8010
        url: http://${laa.ccms.oracle-web-determination-server.redirect.hostname}:${laa.ccms.oracle-web-determination-server.redirect.port}
    caab:
      upload:
        valid-extensions: >
          PDF,
          DOCX,
          RTF,
          TIFF
        valid-mime-types: >
          application/pdf,
          application/vnd.openxmlformats-officedocument.wordprocessingml.document,
          application/x-tika-ooxml,
          application/rtf,
          text/rtf,
          image/tiff
      claim-upload:
        valid-extensions: >
          XML
        valid-mime-types: >
          application/xml
      opa:
        security:
          password: passw0rd

os:
  api:
    hostname: localhost
    port: 8126
    url: ${os.api.hostname}:${os.api.port}
    key: key

av:
  enabled: false
  api:
    hostname: localhost
    port: 8128
    timeout: 20000