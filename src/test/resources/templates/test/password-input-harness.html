<!DOCTYPE html>
<!--
  Minimal harness that renders the client contact fragment in a real Spring form
  binding context, without pulling in layout.html. Used by ClientContactDetailsRenderTest.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:govuk="http://www.thymeleaf.org">
<body>
<form action="#" th:object="${contactDetails}" method="post">
  <div th:replace="~{application/partials/client-fragments :: clientContactFragment}"></div>
</form>
</body>
</html>
