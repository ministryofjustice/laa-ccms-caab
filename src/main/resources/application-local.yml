search:
  max-results:
    page: 20
    #    notification-count: 500
    #    notifications: 500
    clients: 200
    cases: 100
#    statement-of-accounts: 400
#    organisations: 500

portal:
  logoutUrl: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/logout?post_logout_redirect_uri=http://localhost:8010/civil

spring:
  devtools:
    # Local-only: the OPA means/merits interview is long-lived, so an auto-restart
    # mid-interview (e.g. IntelliJ rebuilding when you tab to the browser) wipes the
    # HTTP session and the OPA return lands on the ERROR page instead of the summary.
    restart:
      enabled: false
  security:
    # TODO: local dev previously authenticated against a docker-compose SAML mock
    # (laa-ccms-caab-saml-mock). That container has been removed as part of the migration to
    # OIDC/EntraID; a local OIDC mock IdP is a follow-up. Until then, set AZURE_TENANT_ID,
    # AZURE_CLIENT_ID and AZURE_CLIENT_SECRET as environment variables pointing at a dev
    # EntraID app registration (redirect URI: http://localhost:8010/civil/login/oauth2/code/azure).
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
  cloud:
    aws:
      s3:
        endpoint: https://s3.localhost.localstack.cloud:4566
        region: eu-west-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    uk.gov.laa.ccms.caab: DEBUG
    software:
      amazon:
        awssdk:
          request: DEBUG

