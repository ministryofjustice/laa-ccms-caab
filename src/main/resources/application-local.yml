search:
  max-results:
    page: 20
    #    notification-count: 500
    #    notifications: 500
    clients: 200
    cases: 100
#    statement-of-accounts: 400
#    organisations: 500

portal:
  # Signs you out of the mock IdP as well as this application, so the next sign-in prompts again
  # rather than silently reusing the mock's session.
  logoutUrl: http://localhost:9000/logout

spring:
  devtools:
    # Local-only: the OPA means/merits interview is long-lived, so an auto-restart
    # mid-interview (e.g. IntelliJ rebuilding when you tab to the browser) wipes the
    # HTTP session and the OPA return lands on the ERROR page instead of the summary.
    restart:
      enabled: false
  security:
    # Local dev authenticates against the laa-ccms-caab-oidc-mock container
    # (https://github.com/ministryofjustice/laa-oidc-mock-server), started by docker-compose.
    # Sign in as provider.user@provider.com / password.
    #
    # The client id, secret and redirect URI are the ones the mock server registers; the
    # "silas-identity" registration id has to stay in step with the redirect URI the mock accepts
    # (http://localhost:8010/civil/login/oauth2/code/silas-identity).
    #
    # To run against a real EntraID app registration instead, override these with the tenant's
    # issuer-uri, client id and secret.
    oauth2:
      client:
        registration:
          silas-identity:
            client-id: ${AZURE_CLIENT_ID:bulk-claim-client}
            client-secret: ${AZURE_CLIENT_SECRET:secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
        provider:
          silas-identity:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000}

  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0
  cloud:
    aws:
      s3:
        endpoint: https://s3.localhost.localstack.cloud:4566
        region: eu-west-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    uk.gov.laa.ccms.caab: DEBUG
    software:
      amazon:
        awssdk:
          request: DEBUG

os:
  api:
    hostname: localhost
    port: 8020
    url: http://${os.api.hostname}:${os.api.port}
    key: TEST_KEY

av:
  enabled: true
  api:
    hostname: localhost
    port: 3310
    timeout: 20000

