<div th:fragment="error-summary" class="govuk-error-summary" data-module="govuk-error-summary" th:if="${#fields.hasAnyErrors()}"
     th:with="summaryErrors=${#fields.detailedErrors()}">
  <div role="alert">
    <h2 class="govuk-error-summary__title">
      This page contains one or more errors or warnings
    </h2>
    <div class="govuk-error-summary__body">
      <ul class="govuk-list govuk-error-summary__list" id="error-summary-list">
        <!-- Pair deduplication affects only the summary, never the inline field errors. -->
        <li th:each="error : ${summaryErrors}"
            th:if="${deduplicateAwardPairs != true
                or !#lists.contains({'disputedAmount', 'awardedAmount', 'recoveredAmount'}, error.fieldName)
                or summaryErrors.?[fieldName == #strings.replace(#vars.error.fieldName, 'Amount', 'Percentage')
                    and message == #vars.error.message].isEmpty()}">
          <a th:href="${'#' + error.fieldName}" th:text="${error.message}" />
        </li>
      </ul>
    </div>
  </div>
</div>
