<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns:govuk="http://www.thymeleaf.org">
<head>
  <title th:text="#{service.name} + ' - ' + #{application.create}"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:href="@{/{caseContext}/sections/correspondence-address(caseContext=${caseContext.getPathValue()})}"
       class="govuk-back-link"th:text="#{site.cancelAndReturnToAddress}"></a>
  </div>
  <div id="main-content">
    <form action="#" th:action="@{'/' + ${formAction}}" th:object="${addressSearch}" method="post">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <span class="govuk-caption-l"
          th:text="#{application.generalDetails.correspondenceAddress.searchResults.caption}"/>
      <th:block th:switch="${addressFlow.step.name()}">
        <th:block th:case="'RESULTS'">
          <div th:replace="~{application/partials/address-fragments :: results(
        ${originalPostcode},
        ${originalBuildingSearch},
        ${searchAgainUrl},
        ${manualEntryUrl},
        'correspondence-address')}"></div>
        </th:block>

        <th:block th:case="'NO_RESULTS'">
          <div th:replace="~{application/partials/address-fragments :: noResults(
        ${originalPostcode},
        ${originalBuildingSearch},
        ${searchAgainUrl},
        ${manualEntryUrl})}"></div>
        </th:block>

        <th:block th:case="'LOOKUP_UNAVAILABLE'">
          <div th:replace="~{application/partials/address-fragments :: unavailable(
        ${searchAgainUrl},
        ${manualEntryUrl})}"></div>
        </th:block>
      </th:block>
    </form>
  </div>
</div>
</body>
</html>
