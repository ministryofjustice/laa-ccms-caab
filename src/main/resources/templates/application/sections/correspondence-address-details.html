<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:govuk="http://www.thymeleaf.org">
<head>
  <title th:if="${caseContext.isApplication()}" th:text="#{service.name} + ' - ' + #{application.create}"/>
  <title th:if="${caseContext.isAmendment()}" th:text="#{service.name} + ' - ' + #{correspondenceAddress.edit}"/>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:if="${caseContext.isApplication()}"
       th:href="@{/application/sections}" class="govuk-back-link"
       th:text="#{site.cancelAndReturnToApplication}"></a>
    <a th:if="${caseContext.isAmendment()}"
       th:href="@{/case/overview}" class="govuk-back-link"
       th:text="#{site.cancelAndReturnToCaseOverview}"></a>
  </div>
  <div id="main-content">
    <form th:action="@{/{caseContext}/sections/correspondence-address(caseContext=${caseContext.pathValue})}" th:object="${addressDetails}"
          method="post">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <span class="govuk-caption-l" th:if="${caseContext.isApplication()}" th:text="#{application.create}"/>
      <span class="govuk-caption-l" th:if="${caseContext.isAmendment()}" th:text="#{amendments.amendCase}"/>
      <h1 class="govuk-heading-l"
          th:text="#{application.generalDetails.correspondenceAddress.title}"/>

      <p class="govuk-body-l" th:text="#{application.generalDetails.correspondenceAddress.line1}"/>
      <p class="govuk-body-l" th:text="#{application.generalDetails.correspondenceAddress.line2}"/>

      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <th:block th:replace="~{partials/forms :: autocompleteSelect(field='preferredAddress',
                                                                       label=#{address.preferred},
                                                                       items=${caseAddressOptions},
                                                                       itemValue='code', itemLabel='description')}"/>
          <th:block th:if="${caseAddress}">
            <th:block th:if="${addressFlow.step.name() == 'CONFIRMED_ADDRESS'}">
              <h2 class="govuk-heading-m" th:text="#{address.component.existing.title}"></h2>
              <div class="govuk-inset-text"
                   th:text="${selectedAddress.fullAddress}"></div>
              <p class="govuk-body" th:if="${addressDetails.careOf != null
                  and !addressDetails.careOf.isEmpty()}">
                <span th:text="#{address.careOf}"></span>:
                <span th:text="${addressDetails.careOf}"></span>
              </p>
              <a class="govuk-link" th:href="${changeAddressUrl}"
                 th:text="#{address.component.change}"></a>
              <span class="govuk-body"> | </span>
              <a class="govuk-link" th:href="${manualEntryUrl}"
                 th:text="#{address.component.enterManual}"></a>
            </th:block>
            <th:block th:if="${addressFlow.step.name() == 'EXISTING_ADDRESS'}">
              <div th:replace="~{application/partials/address-fragments :: existingAddress(
                  ${addressDetails}, ${countryName}, ${changeAddressUrl})}"></div>
            </th:block>
            <th:block th:if="${addressFlow.step.name() == 'MANUAL_ENTRY'}">
              <th:block th:replace="~{application/partials/address-fragments :: manualEntry(${countries})}"/>
              <th:block th:replace="~{partials/forms :: textInput('careOf',
                  #{address.careOf}, 'govuk-input--width-20')}"/>
            </th:block>
            <th:block th:if="${addressFlow.step.name() == 'SEARCH'
                or addressFlow.step.name() == 'LOOKUP_UNAVAILABLE'}">
              <th:block th:replace="~{application/partials/address-fragments :: search(
                  'postcode', 'houseNameNumber', 'find_address', ${manualEntryUrl})}"/>
              <th:block th:replace="~{partials/forms :: textInput('careOf',
                  #{address.careOf}, 'govuk-input--width-20')}"/>
            </th:block>
          </th:block>
          <th:block th:unless="${caseAddress}">
            <th:block th:replace="~{partials/forms :: autocompleteSelect(field='country', label=#{address.country},
                                                                         items=${countries}, itemValue='code',
                                                                         itemLabel='description')}"/>
            <th:block th:replace="~{partials/forms :: textInput('houseNameNumber',
              #{address.house},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('postcode',
              #{address.postcode},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('careOf',
              #{address.careOf},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('addressLine1',
              #{address.address1},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('addressLine2',
              #{address.address2},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('cityTown',
              #{address.city},
              'govuk-input--width-20')}"/>
            <th:block th:replace="~{partials/forms :: textInput('county',
              #{address.county},
              'govuk-input--width-20')}"/>
          </th:block>
        </div>
      </div>
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <div class="govuk-button-group">
            <govuk:button th:if="${caseContext.isApplication()}"
                          id="next-button"
                          value="next"
                          th:text="#{site.next}"/>
            <govuk:button th:if="${caseContext.isAmendment()}"
                          id="next-button"
                          value="next"
                          th:text="#{site.confirm}"/>
            <a th:if="${caseContext.isApplication()}" th:href="@{/application/sections}"
               class="govuk-link" th:text="#{site.back}"></a>
            <a th:if="${caseContext.isAmendment()}" th:href="@{/case/overview}"
               class="govuk-link" th:text="#{site.back}"></a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
