<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      xmlns:govuk="http://www.thymeleaf.org">
<head>
    <title th:text="|#{service.name} - #{courtSearch.title}|"></title>
</head>
<body>
<div class="govuk-width-container">
    <div id="breadcrumbs">
        <a th:href="@{/case/outcome-and-awards/proceeding/{index}/outcome(index=${proceedingIndex})}" class="govuk-back-link"
           th:text="#{courtSearch.backLink}"></a>
    </div>
    <div id="main-content">
        <h1 class="govuk-heading-l" th:text="#{courtSearch.title}"></h1>
        <p class="govuk-body" th:text="#{courtSearch.information}"></p>

        <form th:action="@{/court/search(proceedingIndex=${proceedingIndex})}"
              th:object="${courtSearchCriteria}" method="post">
            <div th:replace="~{partials/error-summary :: error-summary}"></div>

            <div th:replace="~{partials/forms :: textInput('courtCode', #{courtSearch.courtCode}, 'govuk-input--width-20')}"></div>
            <div th:replace="~{partials/forms :: textInput('courtName', #{courtSearch.courtName}, 'govuk-input--width-20')}"></div>

            <govuk:button th:text="#{courtSearch.search}"/>
        </form>
    </div>
</div>
</body>
</html>
