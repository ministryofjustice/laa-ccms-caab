<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(
          title=~{::title},
          mainContent=~{::#main-content},
          pageCategory=${'cases'},
          breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:govuk="http://www.thymeleaf.org">

<head>
  <title th:text="#{service.name} + ' - ' + #{case.selectAwardType.title}"></title>
</head>

<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:href="@{/case/outcome-and-awards}" class="govuk-back-link" th:text="#{site.cancelAndReturnToOutcomeAndAwards}"></a>
  </div>

  <div id="main-content">
    <form th:action="@{/case/outcome-and-awards/award-type}"
          th:object="${awardTypeForm}"
          method="post">

      <div th:replace="~{partials/error-summary :: error-summary}"></div>

      <h1 class="govuk-heading-l"
          th:text="#{case.selectAwardType.title}">
        Select award type
      </h1>
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <div th:replace="~{partials/forms :: dropdown('awardTypeCode', #{case.selectAwardType.awardTypeLabel}, ${awardTypes}, 'code', 'description', true)}"></div>
          <govuk:button type="submit" th:text="#{site.next}"/>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
