<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <title th:text="|#{service.name} - #{viewOutcome.title}|"></title>
</head>
<body>
<div class="govuk-width-container">
    <div id="breadcrumbs">
        <a th:href="@{/case/overview}" class="govuk-back-link"
           th:text="#{viewOutcome.overview.return}"></a>
    </div>

    <div id="main-content">
        <h1 class="govuk-heading-l" id="main-heading" th:text="#{viewOutcome.title}"></h1>
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <h2 class="govuk-heading-m"
                    id="view-outcome-proceeding-outcome"
                    th:text="#{viewOutcome.heading.proceedingOutcome}"/>
                <dl class="govuk-summary-list">
                    <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">
                    </div>
                </dl>
            </div>
        </div>

        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <h2 class="govuk-heading-m"
                    id="view-outcome-pre-certificate-and-legal-help-costs"
                    th:text="#{viewOutcome.heading.preCertificateAndLegalHelpCosts}"/>
                <dl class="govuk-summary-list">
                    <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">
                    </div>
                </dl>
            </div>
        </div>

        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <h2 class="govuk-heading-m"
                    id="view-outcome-request-case-discharge"
                    th:text="#{viewOutcome.heading.requestCaseDischarge}"/>
                <dl class="govuk-summary-list">
                    <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">
                    </div>
                </dl>
            </div>
        </div>
    </div>
</div>

</body>
</html>
