<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" xmlns:govuk="http://www.thymeleaf.org">
<head>
  <title th:text="#{service.name} + ' - ' + #{application.create}"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:if="${caseContext.isApplication()}" th:href="@{/application/proceedings-and-costs#case-costs}" class="govuk-back-link" th:text="#{proceedings.cancelAndGoBack}"/>
    <a th:if="${caseContext.isAmendment()}" th:href="@{/amendments/summary}" class="govuk-back-link" th:text="#{site.returnToAmendmentSummary}"/>
  </div>
  <div id="main-content">
    <form action="#" th:action="@{/{caseContext}/case-costs(caseContext=${caseContext.pathValue})}"
          th:object="${costDetails}" method="post">
      <input type="hidden" th:field="*{grantedCostLimitation}"/>

      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <span class="govuk-caption-l" th:text="#{proceedings.caseCosts.caption}"/>
      <h1 class="govuk-heading-l" th:text="#{proceedings.caseCosts.heading}"/>
      <p class="govuk-body-l"
        th:text="#{proceedings.caseCosts.leadParagraph}"/>
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <h2 class="govuk-heading-m"
            th:text="#{proceedings.caseCosts.subheading}"/>
          <dl class="govuk-summary-list">
            <div th:replace="~{application/partials/summary-fragments :: summaryListDisplayWithId(
              #{proceedings.caseCosts.defaultCostLimitation},
              ${#numbers.formatCurrency(costs.defaultCostLimitation)},
              'default-cost-limitation-value')}"></div>
            <th:block th:if="${caseApplication.amendment}">
              <div th:replace="~{application/partials/summary-fragments :: summaryListDisplayWithId(
                #{proceedings.caseCosts.grantedCostLimitation},
                ${#numbers.formatCurrency(costs.grantedCostLimitation)},
                'granted-cost-limitation-value')}"></div>
            </th:block>
          </dl>
          <div th:replace="~{partials/forms :: currencyInput('requestedCostLimitation', #{proceedings.caseCosts.requestedCostLimitation}, 5)}"></div>
          <div class="govuk-button-group">
            <govuk:button type="submit" th:text="#{site.confirm}"/>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
