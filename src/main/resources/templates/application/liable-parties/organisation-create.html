<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - Opponents and Other Parties - Organisation|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a class="govuk-back-link" id="cancelLink"
       th:href="@{${organisationFormUrl + '/cancel'}(journeyToken=${journeyToken})}"
       th:text="${awardPath == 'land' or awardPath == 'asset'} ? #{site.cancelAndReturnToInterestedParties} : #{site.cancelAndReturnToLiableParties}"></a>
  </div>
  <div id="main-content" th:fragment="content">
    <form th:action="@{${organisationFormUrl + '/create'}}"
          th:object="${liablePartyOrganisation}" method="post">
      <input type="hidden" name="journeyToken" th:value="${journeyToken}">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <h1 class="govuk-heading-l">Opponents and other parties - organisation</h1>
      <p class="govuk-body-l" th:text="#{application.opponents.leadParagraph}"></p>
      <h2 class="govuk-heading-m" th:text="#{application.opponents.createNewOrganisation}"></h2>
      <div th:replace="~{application/partials/opponent-fragments :: createOrganisation}"></div>
      <div class="govuk-button-group">
        <button type="submit" class="govuk-button" id="confirmButton" data-module="govuk-button"
                th:text="#{site.confirm}"></button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
