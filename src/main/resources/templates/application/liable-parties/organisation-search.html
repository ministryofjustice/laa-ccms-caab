<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - Opponents and Other Parties - Organisation Search|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a class="govuk-back-link" id="cancelLink"
       th:href="@{${organisationFormUrl + '/cancel'}(journeyToken=${journeyToken})}"
       th:text="${awardPath == 'land' or awardPath == 'asset'} ? #{site.cancelAndReturnToInterestedParties} : #{site.cancelAndReturnToLiableParties}"></a>
  </div>
  <div id="main-content" th:fragment="content">
    <form th:action="@{${organisationFormUrl + '/search'}}"
          th:object="${organisationSearchCriteria}" method="post">
      <input type="hidden" name="journeyToken" th:value="${journeyToken}">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <h1 class="govuk-heading-l">Opponents and other parties</h1>
      <p class="govuk-body-l">
        Please enter the organisation details in the fields provided to perform your search.
      </p>
      <h2 class="govuk-heading-m">Organisation search</h2>
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
          <div th:replace="~{partials/forms :: textInput('name', 'Organisation name', 'govuk-input--width-20')}"></div>
          <th:block th:replace="~{partials/forms :: autocompleteSelect(field='type',
                                                                       label='Organisation type (optional)',
                                                                       items=${organisationTypes},
                                                                       itemValue='code',
                                                                       itemLabel='description')}"/>
          <div th:replace="~{partials/forms :: textInput('city', 'City (optional)', 'govuk-input--width-20')}"></div>
          <div th:replace="~{partials/forms :: textInput('postcode', 'Postcode (optional)', 'govuk-input--width-20')}"></div>

          <div class="govuk-button-group">
            <button type="submit" class="govuk-button" id="searchButton" data-module="govuk-button">Search</button>
            <a class="govuk-button govuk-button--secondary" id="createOrganisationButton"
               data-module="govuk-button" role="button"
               th:href="@{${organisationFormUrl + '/create'}(journeyToken=${journeyToken})}"
               th:text="#{application.opponents.createNewOrganisation}"></a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
