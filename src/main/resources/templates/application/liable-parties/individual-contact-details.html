<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - Opponents and Other Parties - Individual Contact Details|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a class="govuk-back-link"
       th:href="@{${individualFormUrl + '/cancel'}(journeyToken=${journeyToken})}"
       th:text="${awardPath == 'land' or awardPath == 'asset'} ? #{site.cancelAndReturnToInterestedParties} : #{site.cancelAndReturnToLiableParties}"></a>
  </div>
  <div id="main-content" th:fragment="content">
    <form th:action="@{${individualFormUrl}}"
          th:object="${liablePartyIndividual}" method="post">
      <input type="hidden" name="journeyToken" th:value="${journeyToken}">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
      <h1 class="govuk-heading-l">Opponents and other parties</h1>
      <p class="govuk-body-l" th:text="#{application.opponents.leadParagraph}"></p>
      <h2 class="govuk-heading-m">Individual contact details</h2>
      <div th:replace="~{application/partials/opponent-fragments :: individualContactDetails(true)}"></div>
      <div class="govuk-button-group">
        <button type="submit" class="govuk-button" data-module="govuk-button" th:text="#{site.next}"></button>
        <a class="govuk-link"
           th:href="@{${individualBackUrl}}"
           th:text="#{site.back}"></a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
