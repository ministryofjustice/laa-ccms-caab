<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{service.name} + ' - ' + #{courtSearch.title}"></title>
</head>
<body>
<div class="govuk-width-container">
    <div id="breadcrumbs">
        <a th:href="@{/court/search(proceedingIndex=${proceedingIndex})}" class="govuk-back-link" th:text="#{site.returnToCourtSearch}"></a>
    </div>
    <div id="main-content">

        <th:block>
            <h1 class="govuk-heading-l" th:text="#{courtSearch.tooManyResults}"></h1>
            <p class="govuk-body-l" th:text="#{courtSearch.tooManyResults.info1}"></p>
            <p class="govuk-body-l" th:text="#{courtSearch.tooManyResults.info2}"></p>
        </th:block>

    </div>
</div>
</body>
</html>
