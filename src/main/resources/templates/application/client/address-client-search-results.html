<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns:govuk="http://www.thymeleaf.org">
<head>
    <title th:text="#{service.name} + ' - ' + #{application.start}"></title>
</head>
<body>
<div class="govuk-width-container">
    <div id="breadcrumbs">
        <a th:href="@{/application/client/details/address}" class="govuk-back-link" th:text="#{site.cancelAndReturnToAddress}"></a>
    </div>
    <div id="main-content">
        <form action="#" th:action="@{/application/client/details/address/search}" th:object="${addressSearch}" method="post">
            <div th:replace="~{partials/error-summary :: error-summary}"></div>
            <span class="govuk-caption-l" th:text="#{client.about}"></span>
            <th:block th:if="${addressFlow.step.name() == 'RESULTS'}">
              <div th:replace="~{application/partials/address-fragments :: results(
                  ${originalPostcode},
                  ${originalBuildingSearch},
                  @{/application/client/details/address/search-again},
                  @{/application/client/details/address/manual},
                  'client-address')}"></div>
            </th:block>
            <div th:if="${addressFlow.step.name() == 'NO_RESULTS'}"
                 th:replace="~{application/partials/address-fragments :: noResults(
                     ${originalPostcode},
                     ${originalBuildingSearch},
                     @{/application/client/details/address/search-again},
                     @{/application/client/details/address/manual})}"></div>
            <div th:if="${addressFlow.step.name() == 'LOOKUP_UNAVAILABLE'}"
                 th:replace="~{application/partials/address-fragments :: unavailable(
                     @{/application/client/details/address/search-again},
                     @{/application/client/details/address/manual})}"></div>
        </form>
    </div>
</div>
</body>
</html>
