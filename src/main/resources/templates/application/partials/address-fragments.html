<th:block xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="search(postcodeField, buildingField, searchAction, manualEntryUrl)">
    <h2 class="govuk-heading-m" th:text="#{address.component.search.title}"></h2>
    <p class="govuk-body" th:text="#{address.component.search.ukOnly}"></p>

    <th:block th:with="autocomplete='postal-code', hint=#{address.component.search.postcode.hint}">
      <div th:replace="~{partials/forms :: textInput(
          ${postcodeField},
          #{address.component.search.postcode},
          'govuk-input--width-20')}"></div>
    </th:block>
    <th:block th:with="autocomplete='address-line1', hint=#{address.component.search.building.hint}">
      <div th:replace="~{partials/forms :: textInput(
          ${buildingField},
          #{address.component.search.building},
          'govuk-input--width-20')}"></div>
    </th:block>

    <div class="govuk-button-group">
      <button type="submit"
              name="action"
              th:value="${searchAction}"
              class="govuk-button"
              data-module="govuk-button"
              th:text="#{address.component.find}"></button>
      <a class="govuk-link" th:href="${manualEntryUrl}"
         th:text="#{address.component.enterManual}"></a>
    </div>
  </th:block>

  <th:block th:fragment="results(originalPostcode, originalBuildingSearch, searchAgainUrl, manualEntryUrl, radioIdPrefix)">
    <h1 class="govuk-heading-l" th:text="#{address.component.results.title}"></h1>
    <p class="govuk-body"
       th:text="#{address.component.results.count(${#lists.size(addressSearchResults.content)})}"></p>
    <p class="govuk-body">
      <span th:text="#{address.component.search.postcode}"></span>:
      <span th:text="${originalPostcode}"></span>
      <span th:if="${originalBuildingSearch != null and !originalBuildingSearch.isEmpty()}">
        <span th:text="#{address.component.search.building}"></span>:
        <span th:text="${originalBuildingSearch}"></span>
      </span>
      <a class="govuk-link govuk-!-margin-left-2"
         th:href="${searchAgainUrl}"
         th:text="#{address.component.searchAgain}"></a>
    </p>

    <div class="govuk-form-group"
         th:classappend="${#fields.hasErrors('uprn')} ? 'govuk-form-group--error' : ''">
      <span th:if="${#fields.hasErrors('uprn')}"
            th:errors="*{uprn}"
            id="uprn-error"
            class="govuk-error-message"></span>
      <fieldset class="govuk-fieldset"
                th:attr="aria-describedby=${#fields.hasErrors('uprn')
                    ? 'address-results-hint uprn-error' : 'address-results-hint'}">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--m"
                th:text="#{address.component.results.legend}"></legend>
        <div id="address-results-hint" class="govuk-hint"
             th:text="#{address.component.results.hint}"></div>
        <div class="govuk-radios govuk-radios--small" data-module="govuk-radios">
          <div class="govuk-radios__item"
               th:each="result, iter : ${addressSearchResults.content}">
            <input class="govuk-radios__input"
                   type="radio"
                   name="uprn"
                   th:id="${radioIdPrefix + '-result-' + iter.index}"
                   th:value="${result.uprn}">
            <label class="govuk-label govuk-radios__label"
                   th:for="${radioIdPrefix + '-result-' + iter.index}"
                   th:text="${result.fullAddress}"></label>
          </div>
        </div>
      </fieldset>
    </div>

    <div class="govuk-button-group">
      <button type="submit"
              name="action"
              value="use_address"
              class="govuk-button"
              data-module="govuk-button"
              th:text="#{address.component.useAddress}"></button>
      <a class="govuk-link" th:href="${manualEntryUrl}"
         th:text="#{address.component.enterManual}"></a>
    </div>
  </th:block>

  <th:block th:fragment="noResults(originalPostcode, originalBuildingSearch, searchAgainUrl, manualEntryUrl)">
    <h1 class="govuk-heading-l" th:text="#{address.component.noResults.title}"></h1>
    <p class="govuk-body" th:text="#{address.component.noResults.message}"></p>
    <p class="govuk-body">
      <span th:text="#{address.component.search.postcode}"></span>:
      <span th:text="${originalPostcode}"></span>
      <span th:if="${originalBuildingSearch != null and !originalBuildingSearch.isEmpty()}">
        <span th:text="#{address.component.search.building}"></span>:
        <span th:text="${originalBuildingSearch}"></span>
      </span>
    </p>
    <div class="govuk-button-group">
      <a class="govuk-button" data-module="govuk-button"
         th:href="${searchAgainUrl}"
         th:text="#{address.component.searchAgain}"></a>
      <a class="govuk-link" th:href="${manualEntryUrl}"
         th:text="#{address.component.enterManual}"></a>
    </div>
  </th:block>

  <th:block th:fragment="unavailable(searchAgainUrl, manualEntryUrl)">
    <h1 class="govuk-heading-l" th:text="#{address.component.unavailable.title}"></h1>
    <p class="govuk-body" th:text="#{address.component.unavailable.message}"></p>
    <div class="govuk-button-group">
      <a class="govuk-button" data-module="govuk-button"
         th:href="${searchAgainUrl}"
         th:text="#{address.component.searchAgain}"></a>
      <a class="govuk-link" th:href="${manualEntryUrl}"
         th:text="#{address.component.enterManual}"></a>
    </div>
  </th:block>

  <th:block th:fragment="confirmation(selectedAddress, confirmAction, changeUrl, searchAgainUrl, manualEntryUrl)">
    <h1 class="govuk-heading-l" th:text="#{address.component.confirm.title}"></h1>
    <div class="govuk-inset-text" th:text="${selectedAddress.fullAddress}"></div>
    <form th:action="${confirmAction}" method="post">
      <button type="submit"
              name="action"
              value="confirm_address"
              class="govuk-button"
              data-module="govuk-button"
              th:text="#{address.component.useAddress}"></button>
    </form>
    <ul class="govuk-list">
      <li><a class="govuk-link" th:href="${changeUrl}"
             th:text="#{address.component.useDifferentAddress}"></a></li>
      <li><a class="govuk-link" th:href="${searchAgainUrl}"
             th:text="#{address.component.searchAgain}"></a></li>
      <li><a class="govuk-link" th:href="${manualEntryUrl}"
             th:text="#{address.component.enterManual}"></a></li>
    </ul>
  </th:block>

  <th:block th:fragment="manualEntry(countries)">
    <h2 class="govuk-heading-m" th:text="#{address.component.manual.title}"></h2>
    <th:block th:with="autocomplete='address-line1'">
      <div th:replace="~{partials/forms :: textInput(
          'addressLine1',
          #{address.address1},
          'govuk-input--width-20')}"></div>
    </th:block>
    <th:block th:with="autocomplete='address-line2'">
      <div th:replace="~{partials/forms :: textInput(
          'addressLine2',
          #{address.address2.optional},
          'govuk-input--width-20')}"></div>
    </th:block>
    <th:block th:with="autocomplete='address-level2'">
      <div th:replace="~{partials/forms :: textInput(
          'cityTown',
          #{address.city},
          'govuk-input--width-20')}"></div>
    </th:block>
    <th:block th:with="autocomplete='address-level1'">
      <div th:replace="~{partials/forms :: textInput(
          'county',
          #{address.county.optional},
          'govuk-input--width-20')}"></div>
    </th:block>
    <th:block th:with="autocomplete='postal-code'">
      <div th:replace="~{partials/forms :: textInput(
          'postcode',
          #{address.postcode},
          'govuk-input--width-20')}"></div>
    </th:block>

    <div class="govuk-form-group"
         th:classappend="${#fields.hasErrors('country')} ? 'govuk-form-group--error' : ''">
      <label class="govuk-label" for="country" th:text="#{address.country}"></label>
      <span th:if="${#fields.hasErrors('country')}"
            th:errors="*{country}"
            id="country-error"
            class="govuk-error-message"></span>
      <select class="govuk-select"
              id="country"
              th:field="*{country}"
              autocomplete="country"
              th:errorclass="govuk-select--error"
              th:attr="aria-describedby=${#fields.hasErrors('country') ? 'country-error' : null}">
        <option value="" th:text="#{site.select}"></option>
        <option th:each="country : ${countries}"
                th:value="${country.code}"
                th:text="${country.description}"></option>
      </select>
    </div>
  </th:block>

  <th:block th:fragment="existingAddress(addressDetails, countryName, changeUrl)">
    <h2 class="govuk-heading-m" th:text="#{address.component.existing.title}"></h2>
    <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.careOf != null and !addressDetails.careOf.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.careOf}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.careOf}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.houseNameNumber != null and !addressDetails.houseNameNumber.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.house}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.houseNameNumber}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.addressLine1 != null and !addressDetails.addressLine1.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.address1}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.addressLine1}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.addressLine2 != null and !addressDetails.addressLine2.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.address2}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.addressLine2}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.cityTown != null and !addressDetails.cityTown.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.city}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.cityTown}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.county != null and !addressDetails.county.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.county}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.county}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${addressDetails.postcode != null and !addressDetails.postcode.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.postcode}"></dt>
        <dd class="govuk-summary-list__value" th:text="${addressDetails.postcode}"></dd>
      </div>
      <div class="govuk-summary-list__row"
           th:if="${countryName != null and !countryName.isEmpty()}">
        <dt class="govuk-summary-list__key" th:text="#{address.country}"></dt>
        <dd class="govuk-summary-list__value" th:text="${countryName}"></dd>
      </div>
    </dl>
    <a class="govuk-link" th:href="${changeUrl}"
       th:text="#{address.component.change}"></a>
    <a class="govuk-link" th:if="${manualEntryUrl != null}"
       th:href="${manualEntryUrl}"
       th:text="#{address.component.enterManual}"></a>
  </th:block>

</th:block>
