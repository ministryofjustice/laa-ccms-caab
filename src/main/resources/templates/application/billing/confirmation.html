<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Shared by the bill and the payment on account - see declaration.html. -->
  <title th:text="|#{service.name} - #{${billingContext.messagePrefix + '.confirmation.title'}}|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs"></div>
  <!-- Follows the shared submission confirmation (submissions/submissionConfirmed), rather than a
       confirmation panel, so every submission in the service confirms the same way. The EBS
       invoice reference is kept: the legacy PUI discards it, leaving the user nothing to quote. -->
  <div id="main-content" class="govuk-!-padding-top-7">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-l"
            th:text="#{${billingContext.messagePrefix + '.confirmation.heading'}}"></h1>
        <p class="govuk-body-l"
           th:text="#{${billingContext.messagePrefix + '.confirmation.text'}}"></p>
        <p class="govuk-body">
          <span th:text="#{${billingContext.messagePrefix + '.confirmation.reference'}}"></span>:
          <strong th:id="${billingContext.pathValue} + '-submission-reference'"
                  th:text="${transactionId}"></strong>
        </p>
        <div class="govuk-button-group">
          <a class="govuk-button" data-module="govuk-button" role="button" draggable="false"
             th:id="${billingContext.pathValue} + '-confirmation-return-link'"
             th:href="@{/case/billing}"
             th:text="#{${billingContext.messagePrefix + '.confirmation.return'}}"></a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
