<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - #{billing.bill.title}|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:href="@{/case/billing}" class="govuk-back-link"
       th:text="#{site.cancelAndReturnToCaseStatementOfAccount}"></a>
  </div>
  <div id="main-content">
    <!-- Final validation failures land back here carrying their reason, as the legacy PUI does
         rather than disabling Submit until the bill is ready. -->
    <div class="govuk-error-summary" data-module="govuk-error-summary" th:if="${submissionError}"
         id="bill-submission-error">
      <div role="alert">
        <h2 class="govuk-error-summary__title">
          This page contains one or more errors or warnings
        </h2>
        <div class="govuk-error-summary__body">
          <p class="govuk-body" th:text="#{${submissionError}}"></p>
        </div>
      </div>
    </div>
    <span class="govuk-caption-l" th:text="#{billing.pageCaption}"></span>
    <h1 class="govuk-heading-l" th:text="#{billing.bill.title}"></h1>

    <p class="govuk-body" th:text="#{billing.bill.introText}"></p>
    <!-- The breakdown is only there to be viewed once the interview has been completed. -->
    <p class="govuk-body" th:if="${printDraftBill}" th:text="#{billing.bill.introText2}"></p>

    <div class="govuk-summary-card">
      <div class="govuk-summary-card__title-wrapper">
        <h2 class="govuk-summary-card__title" th:text="#{billing.bill.col.billing}"></h2>
        <ul class="govuk-summary-card__actions">
          <li class="govuk-summary-card__action">
            <!-- Starts (or resumes) the billing OPA interview, which takes the user off the PUI. -->
            <a class="govuk-link govuk-link--no-visited-state"
               id="bill-details-link"
               th:href="@{/application/assessments(assessment='billing',invoked-from='CCMS_CB03')}"
               th:text="#{billing.bill.details}"></a>
          </li>
          <li class="govuk-summary-card__action" th:if="${printDraftBill}">
            <a class="govuk-link govuk-link--no-visited-state"
               id="bill-summary-link"
               target="_blank"
               th:href="@{/case/billing/bill/summary}"
               th:text="#{billing.bill.summary}"></a>
          </li>
        </ul>
      </div>
      <div class="govuk-summary-card__content">
        <dl class="govuk-summary-list">
          <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">
            <dt class="govuk-summary-list__key" th:text="#{billing.bill.col.status}"></dt>
            <dd class="govuk-summary-list__value" id="bill-status"
                th:text="${assessmentStatus}"></dd>
          </div>
        </dl>
      </div>
    </div>

    <div class="govuk-button-group">
      <!-- Submit stays available whatever the assessment status: the legacy PUI runs its final
           validation on the click and explains the failure, rather than leaving the user with a
           dead button and no reason. -->
      <!-- A POST, not a link: when no declaration is configured for this bill type there is no
           declaration to show and the bill is submitted on this request, so it must not be
           reachable by following or prefetching a URL. -->
      <form th:action="@{/case/billing/bill/submit}" method="post">
        <button class="govuk-button" data-module="govuk-button"
                data-prevent-double-click="true" id="submit-bill-button"
                th:text="#{billing.bill.submit}"></button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
