<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - #{billing.bill.confirmation.title}|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs"></div>
  <!-- Follows the shared submission confirmation (submissions/submissionConfirmed), rather than a
       confirmation panel, so every submission in the service confirms the same way. The EBS
       invoice reference is kept: the legacy PUI discards it, leaving the user nothing to quote. -->
  <div id="main-content" class="govuk-!-padding-top-7">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-l" th:text="#{billing.bill.confirmation.heading}"></h1>
        <p class="govuk-body-l" th:text="#{billing.bill.confirmation.text}"></p>
        <p class="govuk-body">
          <span th:text="#{billing.bill.confirmation.reference}"></span>:
          <strong id="bill-submission-reference" th:text="${transactionId}"></strong>
        </p>
        <div class="govuk-button-group">
          <a class="govuk-button" data-module="govuk-button" role="button" draggable="false"
             id="bill-confirmation-return-link" th:href="@{/case/billing}"
             th:text="#{billing.bill.confirmation.return}"></a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
