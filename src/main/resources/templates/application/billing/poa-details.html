<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="|#{service.name} - #{billing.poa.title}|"></title>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:href="@{/case/billing}" class="govuk-back-link"
       th:text="#{site.cancelAndReturnToCaseStatementOfAccount}"></a>
  </div>
  <div id="main-content">
    <span class="govuk-caption-l" th:text="#{billing.pageCaption}"></span>
    <h1 class="govuk-heading-l" th:text="#{billing.poa.title}"></h1>

    <p class="govuk-body" th:text="#{billing.poa.introText}"></p>
    <!-- The breakdown is only there to be viewed once the interview has been completed. -->
    <p class="govuk-body" th:if="${viewPoaSummary}" th:text="#{billing.poa.introText2}"></p>

    <div class="govuk-summary-card">
      <div class="govuk-summary-card__title-wrapper">
        <h2 class="govuk-summary-card__title" th:text="#{billing.poa.col.billing}"></h2>
        <ul class="govuk-summary-card__actions">
          <li class="govuk-summary-card__action">
            <!-- Starts (or resumes) the POA OPA interview, which takes the user off the PUI. -->
            <a class="govuk-link govuk-link--no-visited-state"
               id="poa-details-link"
               th:href="@{/application/assessments(assessment='poa',invoked-from='CCMS_POA01')}"
               th:text="#{billing.poa.details}"></a>
          </li>
          <li class="govuk-summary-card__action" th:if="${viewPoaSummary}">
            <!-- Opens the generated POA summary PDF in a new tab, as the legacy PUI did. -->
            <a class="govuk-link govuk-link--no-visited-state"
               id="poa-summary-link"
               target="_blank"
               th:href="@{/case/billing/poa/summary}"
               th:text="#{billing.poa.summary}"></a>
          </li>
        </ul>
      </div>
      <div class="govuk-summary-card__content">
        <dl class="govuk-summary-list">
          <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">
            <dt class="govuk-summary-list__key" th:text="#{billing.poa.col.status}"></dt>
            <dd class="govuk-summary-list__value" id="poa-status"
                th:text="${assessmentStatus}"></dd>
          </div>
        </dl>
      </div>
    </div>

    <div class="govuk-button-group">
      <!-- Submit takes the user to the declaration they must acknowledge before the POA is sent to
           EBS, porting the legacy PUI's declaration + PerformSubmission flow. -->
      <a th:if="${assessmentComplete}" th:href="@{/case/billing/poa/declaration}" role="button"
         draggable="false" class="govuk-button" data-module="govuk-button" id="submit-poa-button"
         th:text="#{billing.poa.submit}"></a>
      <button th:unless="${assessmentComplete}" type="button" disabled aria-disabled="true"
              class="govuk-button" data-module="govuk-button" id="submit-poa-button"
              th:text="#{billing.poa.submit}"></button>
    </div>
  </div>
</div>
</body>
</html>
