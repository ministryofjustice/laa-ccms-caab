<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(title=~{::title},mainContent=~{::#main-content},pageCategory=${'cases'},breadcrumbs=~{::#breadcrumbs})}"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" xmlns:govuk="http://www.thymeleaf.org">
<head>
    <title th:if="${caseContext.isApplication()}" th:text="#{service.name} + ' - ' + #{application.create}"/>
    <title th:if="${caseContext.isAmendment()}" th:text="#{service.name} + ' - ' + #{amendment.case}"/>
</head>
<body>
<div class="govuk-width-container">
  <div id="breadcrumbs">
    <a th:href="@{/{caseContext}/proceedings-and-costs#prior-authority(caseContext=${caseContext.pathValue})}" class="govuk-back-link"
      th:text="#{proceedings.cancelAndGoBack}"/>
  </div>
  <div id="main-content">
    <form action="#"
          th:action="@{/{caseContext}/prior-authorities/{action}/details(action=${priorAuthorityFlow.action}, caseContext=${caseContext.pathValue})}"
          th:object="${priorAuthorityDetails}" method="post">
      <div th:replace="~{partials/error-summary :: error-summary}"></div>
        <span th:if="${caseContext.isApplication()}" class="govuk-caption-l" th:text="#{application.create} + ' - ' + ${#strings.toLowerCase(#messages.msg('proceedings.addPriorAuthorities.caption'))}"/>
        <span th:if="${caseContext.isAmendment()}" class="govuk-caption-l" th:text="#{amendment.case}  + ' - ' + ${#strings.toLowerCase(#messages.msg('proceedings.addPriorAuthorities.caption'))}"/>
        <h1 class="govuk-heading-l"
        th:text="#{proceedings.addPriorAuthorities.step2.heading}"/>
      <p class="govuk-body-l"
         th:text="#{proceedings.addPriorAuthorities.step2.leadParagraph}"/>
      <div class="govuk-grid-row">
        <div class="govuk-grid-column-two-thirds">
            <h2 class="govuk-heading-m"
                th:text="#{proceedings.priorAuthorities.generalDetails}"></h2>
          <dl class="govuk-summary-list">
            <th:block th:replace="~{application/partials/summary-fragments :: summaryListDisplay(
              #{proceedings.priorAuthorities.priorAuthorityType},
              ${priorAuthorityFlow.priorAuthorityTypeFormData.priorAuthorityTypeDisplayValue})}"/>
          </dl>

          <th:block th:replace="~{partials/forms :: textInput(fieldId = 'summary',
           label =  #{site.summary},
            inputClass = 'govuk-input--width-10', maxlength= 35)}"/>
          <th:block th:replace="~{partials/forms :: largeTextInput('justification',
            #{proceedings.priorAuthorities.justification},
            200)}"/>

          <th:block th:if="*{valueRequired}">
            <th:block th:replace="~{partials/forms :: currencyInput('amountRequested',
              #{proceedings.priorAuthorities.amountRequested},'10')}"/>
          </th:block>

          <th:block th:fragment="dynamicOptions" th:each="groupEntry : ${groupedDynamicOptions}">
              <th:block th:if="${!#lists.isEmpty(groupEntry.value)}">
                  <h2 class="govuk-heading-m"
                      th:text="${groupEntry.key.label}"></h2>
                  <th:block th:each="option : ${groupEntry.value}">
                    <th:block th:if="${option.fieldType == 'LOV'}" th:with="lovItems=${#vars[option.code]}">
                        <th:block th:replace="~{partials/forms :: autocompleteSelect(field=${'dynamicOptions[' + option.code + '].fieldValue'},
                                                                                     label=(${option.mandatory} ? ${option.fieldDescription} : ${option.fieldDescription + ' (optional)'}),
                                                                                     items=${lovItems},
                                                                                     itemValue='code',
                                                                                     itemLabel='description',
                                                                                     withDisplayValue=true)}"/>
                    </th:block>
                    <div class="govuk-form-group"
                    th:unless="${option.fieldType == 'LOV'}"
                    th:classappend="${#fields.hasErrors('dynamicOptions[__${option.code}__].fieldValue')} ? 'govuk-form-group--error' : ''">

                    <th:block th:if="${option.mandatory}">
                        <label class="govuk-label" th:for="'dynamicOptions[' + ${option.code} + '].fieldValue'"
                        th:text="${option.fieldDescription}"/>
                    </th:block>
                    <th:block th:unless="${option.mandatory}">
                        <label class="govuk-label" th:for="'dynamicOptions[' + ${option.code} + '].fieldValue'"
                        th:text="${option.fieldDescription + ' (optional)'}"/>
                    </th:block>
                    <span th:if="${#fields.hasErrors('dynamicOptions[__${option.code}__].fieldValue')}"
                        th:errors="*{dynamicOptions[__${option.code}__].fieldValue}" class="govuk-error-message">
                    </span>
                    <th:block th:if="${option.fieldType == 'FTS'}">
                        <th:block th:replace="~{partials/forms :: bareInput(${'dynamicOptions[' + option.code + '].fieldValue'}, 'govuk-input--width-20', 30)}"/>
                    </th:block>
                    <th:block th:if="${option.fieldType == 'FTL'}">
                        <th:block th:replace="~{partials/forms :: bareInput(${'dynamicOptions[' + option.code + '].fieldValue'}, '', 80)}"/>
                    </th:block>
                    <th:block th:if="${option.fieldType == 'AMT'}">
                        <th:block th:replace="~{partials/forms :: bareCurrencyInput(${'dynamicOptions[' + option.code + '].fieldValue'})}"/>
                    </th:block>
                    <th:block th:if="${option.fieldType == 'INT'}">
                        <th:block th:replace="~{partials/forms :: bareNumericInput(${'dynamicOptions[' + option.code + '].fieldValue'})}"/>
                    </th:block>
                    </div>
                </th:block>
              </th:block>
          </th:block>

          <div class="govuk-button-group">
            <govuk:button type="submit" th:text="#{site.confirm}"/>
            <a th:if="${priorAuthorityFlow.action} == 'add'"
               th:href="@{/{caseContext}/prior-authorities/{action}/type(action=${priorAuthorityFlow.action}, caseContext=${caseContext.pathValue})}"
               class="govuk-link" th:text="#{site.back}"></a>
            <a th:if="${priorAuthorityFlow.action} == 'edit'"
               th:href="@{/{caseContext}/proceedings-and-costs#prior-authority(caseContext=${caseContext.pathValue})}"
               class="govuk-link" th:text="#{site.back}"></a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
