pluginManagement {
    repositories {
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

includeBuild("../laa-ccms-caab-api") {
    dependencySubstitution {
        substitute module("uk.gov.laa.ccms.caab:caab-api") using project(":caab-api")
    }
}

rootProject.name = 'laa-ccms-caab'
